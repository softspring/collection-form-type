name: CI

on:
    push:
        branches: [ 6.0 ]
    pull_request:
        branches: [ 6.0 ]

permissions:
    contents: read

env:
    XDEBUG_MODE: coverage

jobs:
    backend:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                php-versions: [ '8.4' ]
                composer-prefer: [ '', '--prefer-lowest' ]

        steps:
            -   uses: actions/checkout@v6

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-versions }}
                    coverage: xdebug

            -   name: Validate composer.json
                run: composer validate --strict --no-check-lock

            -   name: Install PHP dependencies
                run: composer update --prefer-dist --no-interaction --no-progress --no-scripts --ansi ${{ matrix.composer-prefer }}

            -   name: Run tests
                run: composer run run-tests

            -   name: Upload coverage to Codecov
                uses: codecov/codecov-action@v6
                with:
                    token: ${{ secrets.CODECOV_TOKEN }}
                    files: clover.xml

    frontend:
        needs: backend
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-versions: [ '20' ]

        steps:
            -   uses: actions/checkout@v6

            -   name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: ${{ matrix.node-versions }}

            -   name: Check Node.js Version
                run: node -v

            -   name: Build assets
                run: node assets/build-dist.mjs

    build-dist:
        needs: frontend
        runs-on: ubuntu-latest
        permissions:
            contents: write

        env:
            CI_COMMIT_MESSAGE: Continuous Integration Assets Build Artifacts
            CI_COMMIT_AUTHOR: Continuous Integration
            BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

        steps:
            -   uses: actions/checkout@v6
                with:
                    ref: ${{ env.BRANCH_NAME }}

            -   name: Build dist
                run: node assets/build-dist.mjs

            -   name: Check dist is clean on pull requests
                if: github.event_name == 'pull_request'
                run: |
                    if [ -n "$(git status --porcelain -- assets/dist)" ]; then
                        git status --short -- assets/dist
                        exit 1
                    fi

            -   name: Commit dist changes
                if: github.event_name == 'push'
                run: |
                    if [ -z "$(git status --porcelain -- assets/dist)" ]; then
                        exit 0
                    fi

                    git config user.name "${{ env.CI_COMMIT_AUTHOR }}"
                    git config user.email "username@users.noreply.github.com"
                    git add assets/dist
                    git commit -m "${{ env.CI_COMMIT_MESSAGE }}"
                    git push origin HEAD:${{ env.BRANCH_NAME }}
