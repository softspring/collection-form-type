name: Build assets

on:
    push:
        branches: [ 6.0 ]
    pull_request:
        branches: [ 6.0 ]

permissions:
    contents: write

env:
    CI_COMMIT_MESSAGE: Continuous Integration Assets Build Artifacts
    CI_COMMIT_AUTHOR: Continuous Integration
    BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v6
                with:
                    ref: ${{ env.BRANCH_NAME }}

            -   name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: '20'

            -   name: Install npm dependencies
                working-directory: assets
                run: npm ci

            -   name: Build assets
                working-directory: assets
                run: npm run build

            -   name: Commit built assets
                if: github.event_name == 'push'
                run: |
                    git config --global user.name "${{ env.CI_COMMIT_AUTHOR }}"
                    git config --global user.email "username@users.noreply.github.com"
                    git add assets/dist assets/package-lock.json
                    git commit -m "${{ env.CI_COMMIT_MESSAGE }}" || echo "No changes to commit"
                    git push origin ${{ env.BRANCH_NAME }} || echo "No changes to push"
